<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Editar Agendamento | BeautyStyle</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" th:href="@{/css/form-edicao.css}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />
</head>
<body>
    <div class="page-wrapper">
        <div class="form-card">
            <div class="page-title">
                <h1>Editar Agendamento</h1>
                <p>Atualize os detalhes do horário abaixo.</p>
            </div>

            <!-- Formulário de Edição -->
            <form th:action="@{'/editar/' + ${agendamento.id}}" th:object="${agendamento}" method="post" class="appointment-form">
                <div class="form-field">
                    <label for="nomeCliente">Nome do Cliente</label>
                    <input type="text" id="nomeCliente" th:field="*{nomeCliente}" />
                </div>

                <div class="form-field">
                    <label for="servico">Serviço</label>
                    <input type="text" id="servico" th:field="*{servico}" />
                </div>

                <div class="form-field">
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" th:field="*{telefone}" />
                </div>

                <div class="form-field">
                    <label for="dataHora">Data e Hora</label>
                    <!-- Formatação do valor do campo para o padrão ISO que o input datetime-local espera -->
                    <input type="datetime-local" id="dataHora" th:field="*{dataHora}" />
                </div>

                <div class="action-buttons-container">
                    <button type="submit" class="btn-primary-action">
                        <i class="fas fa-save"></i> Salvar Alterações
                    </button>
                    <a th:href="@{/agendamentos}" class="btn-secondary-action">
                         <i class="fas fa-times"></i> Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
