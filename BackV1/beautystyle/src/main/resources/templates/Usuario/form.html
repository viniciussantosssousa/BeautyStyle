<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Usuarios</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>
    <div th:replace="fragments/navbar :: navbar"></div>

    <main class="main-content">

        <h1>Cadastrar Usuarios</h1>
        <form th:action="@{/usuarios/cadastrar}" th:object="${usuario}" method="post">
            <div>
                <label>Nome: </label>
                <input type="text" th:field="*{nome}" placeholder="Digite o nome" />
                <div th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
            </div>

            <div>
                <label>Email: </label>
                <input type="email" th:field="*{email}" placeholder="Digite o email"/>
                <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <div>
                <label>Telefone: </label>
                <input type="tel" th:field="*{telefone}" placeholder="Digite o telefone" />
                <div th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}"></div>
            </div>

            <div>
                <label>Senha: </label>
                <input type="password" th:field="*{senha}" placeholder="Digite o senha" />
                <div th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></div>
            </div>

            <button type="submit" class="botao">Salvar</button>
        </form>

    </main>

    <footer>
        <p>2025 Meu App</p>
    </footer>
</body>

</html>
